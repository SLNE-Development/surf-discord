how-to-join.de.short=Eine Anleitung zum Beitreten findest du hier: https://docs.castcrafter.de/how-to-join (Event-Server ohne Whitelist, Survival-Server mit Whitelist)
how-to-join.en.question=How can you join the CastCrafter server?
how-to-join.en.long=Do you want to become part of our community? Here is a simple guide on how to join the server:\n\
  - Take a look at our guide here: [Guide to joining](https://docs.castcrafter.de/how-to-join)\n\
  - You do not need a whitelist for the event server.\n\
  - You need a whitelist for the survival server.\n\n\
   -# We are looking forward to seeing you on the server soon!
how-to-join.en.short=You can find a guide on joining here: https://docs.castcrafter.de/how-to-join (event server without whitelist, survival server with whitelist)

ask.de.short=Stell deine Frage einfach direkt und warte geduldig auf eine Antwort. Frag nicht erst, ob du fragen darfst.
ask.en.question=Just ask directly.
ask.en.long=If you have a question, just ask it. Do not look for specific people or experts. Do not ask whether you may ask a question or whether someone is awake or available. Ask your question directly in the channel and wait patiently for an answer.
ask.en.short=Just ask your question directly and wait patiently for an answer. Do not ask whether you may ask first.

missing-information.de.short=Uns fehlen Informationen: Bitte nenne Server, Koordinaten, Dimension, eine genaue Beschreibung des Problems und den Zeitraum.
missing-information.en.question=Missing information
missing-information.en.long=We are currently still missing some important information to be able to process your request.\n\n\
Please check again whether you have given us all the important information:\n\n\
• **Server** on which it occurred\n\
• **Coordinates** (e.g. `110 64 60`)\n\
• **Dimension** (e.g. `Overworld`)\n\
• **An exact description of the problem**\n\
• **Time period** (e.g. `Yesterday 12:30 to 13:30`)
missing-information.en.short=We are missing information: please provide the server, coordinates, dimension, an exact description of the problem and the time period.

how-to-whitelist.de.short=Für den Survival-Server brauchst du eine aktive Discord-Minecraft Verbindung. Diese kannst du hier einrichten: https://auth.castcrafter.de/account?tab=accounts
how-to-whitelist.en.question=How do I get whitelisted?
how-to-whitelist.en.long=To be able to play on the survival server, instead of a whitelist you need\nan active Discord-Minecraft connection. You can set it up at https://auth.castcrafter.de/account?tab=accounts.\n\nAs soon as both your Discord and your Minecraft account are linked,\nyou can join the survival server. You can check your whitelist status in the \n<#1124438644523012234> channel using the **Check whitelist** button.
how-to-whitelist.en.short=For the survival server you need an active Discord-Minecraft connection. You can set it up here: https://auth.castcrafter.de/account?tab=accounts

ping-pong.de.short=Das Serverteam arbeitet ehrenamtlich und sieht alle Nachrichten und Tickets. Pings beschleunigen nichts, bitte hab etwas Geduld.
ping-pong.en.question=Response times & pings: what you should know!
ping-pong.en.long=Why does the server team not answer immediately?\n\
  - The server team works voluntarily in their free time.\n\
  - We try to help with problems and requests as quickly as possible.\n\
  - Pings are not necessary, the team sees all messages and tickets.\n\
  - Pings do not speed anything up, they can even delay the processing.\n\
  - Please be patient and wait for an answer.\n\n\
  Thank you for your understanding and consideration.
ping-pong.en.short=The server team works voluntarily and sees all messages and tickets. Pings do not speed anything up, please be patient.
