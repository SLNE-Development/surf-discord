banned.de.question=Ich wurde gebannt. Was kann ich tun?
banned.de.long=Wenn du denkst, dir ist mit einem Ausschluss vom Server unrecht getan, erstelle einen [Entbannungsantrag](https://docs.castcrafter.de/support#unban-ticket)!
next-event.de.question=Wann findet das nächste Event statt?
next-event.de.long=Wenn ein Event geplant ist, wird dies im Discord unter https://discord.com/channels/133198459531558912/980810495877607524 oder durch CastCrafter im Stream angekündigt.
how-to-open-ticket.de.question=Wie erstelle ich ein Ticket?
how-to-open-ticket.de.long=Eine Anleitung, wie du ein Ticket erstellen kannst, findest du hier: [Anleitung](https://docs.castcrafter.de/support.html)
rulebook.de.question=Regelwerk
rulebook.de.long=Alle Regeln, die auf dem Server gelten, findest du hier: \
  [Regelwerk](https://docs.castcrafter.de/rules)\n\n\
  Bitte lies die Regeln sorgfältig durch, um sicherzustellen, dass alle Mitglieder eine positive Erfahrung haben.\n\n\
  -# Bei Events **können** die Regeln abweichen. \
  Diese Änderungen findest du auf der jeweiligen Event-Seite in der Dokumentation.
server-modpack.de.question=Offizielles Server Modpack
server-modpack.de.long=Um das Spielerlebnis auf dem Server zu optimieren \
  gibt es ein offizielles Modpack, welches ausschließlich getestete Modifikationen enthält. \
  Alle enthaltenen Mods sind erlaubt und mit dem Server kompatibel.\n\
  **Das Modpack könnt ihr auf [Modrinth](https://modrinth.com/modpack/castcrafter-survival-server) herunterladen.**\n\n\
  -# **Änderungen am Modpack oder das Hinzufügen zusätzlicher Mods können zu Inkompatibilitäten und \
  unter Umständen zu einem Ausschluss des Servers führen. \
  Wir übernehmen keine Verantwortung für modifizierte Versionen des Modpacks.**
problem-resourcepack.de.question=Probleme mit dem Ressourcenpaket
problem-resourcepack.de.long=Das Ressourcenpaket läd nicht richtig oder du \
  erhältst dauerhaft die Nachricht `Aktiviere Ressourcenpaket...`?\n\
  Hier findest du eine Anleitung, wie du das Problem beheben kannst: \
  [Anleitung](https://docs.castcrafter.de/troubleshooting.html#resourcepack-issues)
problem-chat.de.question=Probleme mit dem Chat
problem-chat.de.long=Du hast Probleme mit dem Chat, Nachrichten werden nicht gesendet oder du erhältst die Meldung \
  `Der Chat wurde aufgrund eines fehlenden öffentlichen Profilschlüssels deaktiviert`?\n\
  Hier findest du eine Anleitung, wie du das Problem beheben kannst: \
  [Anleitung](https://docs.castcrafter.de/troubleshooting.html#chat-issues)
problem-nrc-voice-chat.de.question=Probleme mit dem NoRisk Client Voice Chat
problem-nrc-voice-chat.de.long=Du hast Probleme mit dem NoRisk Client Voice Chat, weil er sich nicht verbindet?\n\
Hier findest du eine Anleitung, wie du das Problem beheben kannst: \
  [Anleitung](https://docs.castcrafter.de/troubleshooting.html#nrc-voicechat-issues)
problem-connection.de.question=Verbindungsprobleme / Netzwerk Lags
problem-connection.de.long=Du kannst dich nicht mit dem Server verbinden, \
  wirst wegen `Unstable Connection` vom Server geworfen oder hast regelmäßig starke Lags?\n\
  Hier findet du eine Anleitung, wie du das Problem beheben kannst: \
  [Anleitung](https://docs.castcrafter.de/troubleshooting.html#connection-issues)
read-the-docs.de.question=Dokumentation
read-the-docs.de.long=Diese und weitere Fragen werden in unserer ausführlichen \
  Dokumentation beantwortet: [Dokumentation](https://docs.castcrafter.de/community-server-landing-page)\n\n\
  Für detaillierte Anleitungen, Tipps und häufig gestellte Fragen besuche den obigen Link.
maintenance.de.question=Wartungsarbeiten am Netzwerk
maintenance.de.long=Aktuell finden Wartungsarbeiten am gesamten Netzwerk statt. \
  Bitte habe Geduld. Weitere Informationen findest du unter https://discord.com/channels/133198459531558912/980810495877607524
how-to-share-log.de.question=Wie teile ich meinen Log?
how-to-share-log.de.long=Eine Anleitung, wie du deinen Log teilst, findest du hier: [Anleitung](https://docs.castcrafter.de/faq#find-minecraft-log)
clan-info.de.question=Clan-Informationen
clan-info.de.long=Du suchst den Besitzer eines Clans oder möchtest mehr über einen Clan erfahren? \
  [Hier](https://docs.castcrafter.de/clan-more-info.html) findest du eine Übersicht mit zusätzlichen Informationen.
take-part-in-event.de.question=Wie kann ich an einem Event teilnehmen?
take-part-in-event.de.long=[Hier](https://docs.castcrafter.de/how-to-take-part-in-an-event.html) findest du eine Anleitung zur Teilnahme an einem Event.
how-to-join.de.question=Wie kannst du den CastCrafter-Server betreten?
how-to-join.de.long=Möchtest du Teil unserer Community werden? Hier ist eine einfache Anleitung, wie du dem Server beitreten kannst:\n\
  - Schau dir unsere Anleitung hier an: [Anleitung zum Beitreten](https://docs.castcrafter.de/how-to-join)\n\
  - Du brauchst keine Whitelist für den Event-Server.\n\
  - Für den Survival-Server brauchst du eine Whitelist.\n\n\
   -# Wir freuen uns, dich bald auf dem Server zu sehen!
ask.de.question=Frag einfach direkt.
ask.de.long=Wenn du eine Frage hast, stell sie einfach. Suche nicht nach bestimmten Personen oder Experten. Frage nicht, ob du eine Frage stellen darfst oder ob jemand wach oder verfügbar ist. Stell deine Frage direkt im Kanal und warte geduldig auf eine Antwort.
missing-information.de.question=Fehlende Informationen
missing-information.de.long=Uns fehlen aktuell noch einige wichtige Informationen, um dein Anliegen bearbeiten zu können.\n\n\
Bitte überprüfe noch einmal, ob du uns alle wichtigen Informationen mitgeteilt hast:\n\n\
• **Server**, auf dem es aufgetreten ist\n\
• **Koordinaten** (z. B. `110 64 60`)\n\
• **Dimension** (z. B. `Overworld`)\n\
• **Eine genaue Beschreibung des Problems**\n\
• **Zeitraumangabe** (z. B. `Gestern 12:30 Uhr bis 13:30 Uhr`)
how-to-whitelist.de.question=Wie werde ich gewhitelisted?
how-to-whitelist.de.long=Um auf dem Survival-Server spielen zu können, brauchst du anstatt einer Whitelist,\neine aktive Discord-Minecraft Verbindung. Diese kannst du auf https://auth.castcrafter.de/account?tab=accounts einrichten.\n\nSobald sowohl dein Discord- als auch dein Minecraft-Account verknüpft sind,\nkannst du den Survival-Server betreten. Dein Whiteliststatus kannst du im \n<#1124438644523012234> Kanal über den Button **Whitelist überprüfen** einsehen.
ping-pong.de.question=Antwortzeiten & Pings – das solltet ihr wissen!
ping-pong.de.long=Warum antwortet das Serverteam nicht sofort?\n\
  - Das Serverteam arbeitet ehrenamtlich in seiner Freizeit.\n\
  - Wir bemühen uns, bei Problemen und Anliegen so schnell wie möglich zu helfen.\n\
  - Pings sind nicht notwendig – das Team sieht alle Nachrichten und Tickets.\n\
  - Pings beschleunigen nichts, sie können die Bearbeitung sogar verzögern.\n\
  - Bitte habt etwas Geduld und wartet auf eine Antwort.\n\n\
  Vielen Dank für euer Verständnis und eure Rücksichtnahme.

