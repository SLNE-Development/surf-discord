# Ticket Command
ticket.command.not-a-ticket=Du musst dich in einem Ticket befinden, um diesen Befehl zu nutzen.
ticket.command.ticketbuttons.title=Ticket erstellen
ticket.command.ticketbuttons.description=Du möchtest eine Whitelist-Anfrage stellen, einen Spieler bzw. ein Problem melden oder einen Entbannungsantrag für den Server erstellen, so kannst du hier ein Ticket erstellen.\n\nBitte mache dich vorher mit den unterschiedlichen Tickettypen vertraut!\nDie Übersicht findest du hier: https://server.castcrafter.de/support\n\nAllgemeine Fragen sollten in den dafür vorgesehenen öffentlichen Kanälen gestellt werden.\n\nWir bemühen uns die Tickets schnellstmöglich zu bearbeiten, jedoch arbeitet das gesamte Team freiwillig, und gerade unter der Woche kann die Bearbeitung der Tickets länger dauern.
